model_version: "1.0"
agent:
  id: ai.product.similar_finder
  version: 1.0.0
  name: Similar Feature Finder
  description: Find similar or duplicate feature requests.

  prompts:
    - role: system
      content: |
        Find similar or duplicate feature requests.

        **New Feature:**
        - Title: {{issue.title}}
        - Description: {{issue.description}}
        - Category: {{issue.custom_fields.category}}

        **Existing Features:**
        {{#each context.existing_features}}
        - #{{this.id}}: {{this.title}} ({{this.status}})
          {{this.description}}
        {{/each}}

        Analyze and return:
        - duplicates: Features that are essentially the same request
        - similar: Features that overlap significantly
        - related: Features that could be combined or affect this one
        - recommendation: proceed/merge/defer
        - merge_candidates: IDs of features to potentially merge with
        - notes: Context for product team

  capabilities:
    - duplicate_detection
    - similarity_analysis

  inputs:
    - name: issue
      type: object
      description: The new feature request

  outputs:
    - name: duplicates
      type: array
    - name: similar
      type: array
    - name: related
      type: array
    - name: recommendation
      type: string

  tools: []
