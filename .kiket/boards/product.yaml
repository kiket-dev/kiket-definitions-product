model_version: "1.0"
board:
  id: product-board
  name: Product Roadmap
  description: Feature development and product roadmap.
  version: 1.0.0

  filters:
    issue_types:
      - feature
    workflows:
      - product

  columns:
    - id: ideas
      name: Ideas
      states:
        - idea
      wip_limit: null
      color: secondary

    - id: evaluating
      name: Evaluating
      states:
        - evaluating
      wip_limit: 10
      color: info

    - id: planned
      name: Planned
      states:
        - planned
      wip_limit: 15
      color: primary

    - id: in_progress
      name: In Progress
      states:
        - in_progress
      wip_limit: 5
      color: primary

    - id: review
      name: Review
      states:
        - review
      wip_limit: 5
      color: warning

    - id: released
      name: Released
      states:
        - released
      wip_limit: null
      color: success

  swimlanes:
    enabled: true
    field: custom_fields.effort
    values:
      - value: XS
        label: "XS - Quick Win"
      - value: S
        label: "S - Small"
      - value: M
        label: "M - Medium"
      - value: L
        label: "L - Large"
      - value: XL
        label: "XL - Epic"

  card_fields:
    - title
    - custom_fields.category
    - custom_fields.effort
    - custom_fields.user_priority
    - assignee

  quick_filters:
    - field: custom_fields.category
      label: New Features
      value: new_feature
    - field: custom_fields.effort
      label: Quick Wins
      values: [XS, S]
    - field: status
      label: In Development
      values: [in_progress, review]
