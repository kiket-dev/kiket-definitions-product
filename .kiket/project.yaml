model_version: "1.0"
project:
  key: PRODUCT
  name: Product Development
  version: 1.0.0
  description: Feature requests, roadmap planning, and product development workflows.

  team:
    roles:
      - name: pm
        description: Product manager responsible for roadmap and priorities
      - name: designer
        description: UX/UI designer creating mockups and specifications
      - name: analyst
        description: Product analyst researching user needs and metrics

  extensions:
    optional:
      - slack
      - github

  seed_data:
    issues:
      - title: Custom dashboard builder for enterprise accounts
        description: Allow enterprise users to create personalized dashboards with drag-and-drop widgets, saved filters, and scheduled email reports.
        case_type: feature
        status: in_progress
        priority: high
        labels:
          - enterprise
          - dashboard

      - title: Improve onboarding wizard completion rate
        description: Current wizard has a 34% drop-off at step 3. Redesign the flow to reduce friction and add progress indicators.
        case_type: enhancement
        status: evaluating
        priority: high
        labels:
          - onboarding
          - ux

      - title: Research AI-assisted issue categorization approaches
        description: Evaluate LLM-based classification vs rule-based approaches for automatic issue tagging. Compare accuracy, latency, and cost.
        case_type: research
        status: planned
        priority: medium
        labels:
          - ai
          - classification

      - title: Spike on real-time notifications via WebSocket
        description: Prototype a WebSocket-based notification system to replace polling. Measure latency improvement and connection overhead.
        case_type: spike
        status: idea
        priority: low
        labels:
          - notifications
          - architecture

      - title: Bulk operations for board card management
        description: Users need to select multiple cards and apply bulk actions like move, assign, label, and archive from the board view.
        case_type: feature
        status: review
        priority: medium
        labels:
          - board
          - productivity

      - title: Add keyboard shortcuts to command palette
        description: Extend the command palette to show and execute keyboard shortcuts. Include customizable bindings per user.
        case_type: enhancement
        status: in_progress
        priority: medium
        labels:
          - command-palette
          - accessibility
